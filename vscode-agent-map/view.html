<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>Agent Map</title>
<style>
  :root {
    --bg: var(--vscode-editor-background);
    --fg: var(--vscode-foreground);
    --muted: var(--vscode-descriptionForeground);
    --panel: var(--vscode-sideBar-background, var(--vscode-editorWidget-background));
    --raised: var(--vscode-editorWidget-background, var(--panel));
    --border: var(--vscode-widget-border, var(--vscode-panel-border, #8884));
    --hover: var(--vscode-list-hoverBackground);
    --selbg: var(--vscode-list-inactiveSelectionBackground, var(--hover));
    --focus: var(--vscode-focusBorder);
    --mono: var(--vscode-editor-font-family, ui-monospace, monospace);
    /* status vocabulary: one hue per state, used for dot + tint, never for text */
    --run:   var(--vscode-charts-green, #3fb950);
    --wait:  var(--vscode-charts-blue, #4c9aff);
    --pause: var(--vscode-charts-yellow, #d29922);
    --bad:   var(--vscode-charts-red, #f85149);
    --done:  var(--vscode-charts-purple, #a371f7);
    --idle:  var(--vscode-disabledForeground, #8888);
    --r: 6px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--vscode-font-family); font-size: 13px; line-height: 1.45; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 1px solid var(--focus); outline-offset: 1px; }

  /* ── header ─────────────────────────────────────────── */
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border);
           padding: 14px 28px 12px; display: grid; gap: 10px; }
  .hrow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .pulse { display: flex; gap: 6px; flex-wrap: wrap; }
  .stat { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px;
          background: color-mix(in srgb, var(--c, var(--idle)) 14%, transparent); font-variant-numeric: tabular-nums; }
  .stat b { font-weight: 600; }
  .stat.zero { background: none; color: var(--muted); }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
  .seg button, .tog { background: none; border: 0; padding: 3px 10px; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover, .tog:hover { background: var(--hover); color: var(--fg); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .tog { border: 1px solid var(--border); border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
  .tog::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--muted); }
  .tog[aria-pressed="true"] { color: var(--fg); border-color: var(--focus); background: color-mix(in srgb, var(--focus) 12%, transparent); }
  .tog[aria-pressed="true"]::before { background: var(--focus); border-color: var(--focus); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; padding: 20px 28px 48px; align-items: start; }

  /* ── status pill / dot ──────────────────────────────── */
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--idle)); flex-shrink: 0; }
  .live .dot, .dot.live { animation: beat 1.6s ease-out infinite; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px 1px 7px; border-radius: 999px; font-size: 11px;
          white-space: nowrap; background: color-mix(in srgb, var(--c, var(--idle)) 16%, transparent); }
  .s-run { --c: var(--run); } .s-wait { --c: var(--wait); } .s-pause { --c: var(--pause); }
  .s-bad { --c: var(--bad); } .s-done { --c: var(--done); } .s-idle { --c: var(--idle); }

  /* ── sessions + agent tree ──────────────────────────── */
  .session { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin-bottom: 14px; overflow: hidden; }
  .session.dim { opacity: .72; }
  .row { display: grid; grid-template-columns: 16px auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
         padding: 7px 14px 7px 8px; cursor: pointer; border-radius: var(--r); }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--selbg); box-shadow: inset 0 0 0 1px var(--focus); }
  .shead { padding: 11px 14px 11px 8px; border-radius: 0; }
  .shead .name { font-weight: 600; font-size: 13.5px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .name small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .type { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 8px; }
  .nums { display: flex; gap: 14px; align-items: center; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
  .nums .t { min-width: 52px; text-align: right; }
  .meter { width: 54px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; display: block; }
  .meter i { display: block; height: 100%; background: var(--c, var(--focus)); }
  .caret { width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted); border-radius: 3px; user-select: none; font-size: 10px; }
  .caret[data-toggle]:hover { background: var(--hover); color: var(--fg); }
  .body { padding: 2px 8px 8px; border-top: 1px solid var(--border); }
  .kids { margin-left: 15px; padding-left: 12px; border-left: 1px solid var(--border); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .chip.pending { color: var(--fg); border-color: var(--pause); }
  .chip.approve { color: var(--fg); border-color: var(--run); }
  .chip.deny { color: var(--fg); border-color: var(--bad); }

  /* ── details ────────────────────────────────────────── */
  .details { position: sticky; top: 112px; max-height: calc(100vh - 128px); overflow: auto; border: 1px solid var(--border);
             border-radius: 8px; background: var(--panel); }
  .dhead { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
  .dhead h3 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; overflow-wrap: anywhere; }
  .dhead .sub { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  .activity { display: flex; gap: 8px; align-items: baseline; padding: 9px 16px; font-family: var(--mono); font-size: 12px;
              background: color-mix(in srgb, var(--c) 9%, transparent); border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
  .activity .dot { transform: translateY(1px); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 0; background: var(--border); border-bottom: 1px solid var(--border); }
  .stats div { background: var(--panel); padding: 9px 16px; min-width: 0; }
  .stats dt { color: var(--muted); font-size: 11px; }
  .stats dd { margin: 1px 0 0; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .btn { border: 1px solid var(--border); background: none; border-radius: 4px; padding: 3px 11px; cursor: pointer; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border-color: transparent; }
  .btn.primary:hover { background: var(--vscode-button-hoverBackground); }
  .btn.danger { border-color: color-mix(in srgb, var(--bad) 70%, transparent); }
  .btn.danger:hover { background: color-mix(in srgb, var(--bad) 18%, transparent); }
  .sec { padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .sec:last-child { border-bottom: 0; }
  .sec > summary, .sec h4 { cursor: pointer; font-weight: 600; font-size: 12px; margin: 0; list-style: none; display: flex; gap: 6px; align-items: center; }
  .sec > summary::-webkit-details-marker { display: none; }
  .sec h4 { cursor: default; }
  .sec > summary::before { content: "▶"; color: var(--muted); font-size: 9px; width: 10px; }
  .sec[open] > summary::before { content: "▼"; }
  .sec .n { color: var(--muted); font-weight: 400; }
  .pre { white-space: pre-wrap; max-height: 280px; overflow: auto; margin: 8px 0 2px; padding: 8px 10px; border-radius: 4px;
         background: var(--vscode-textCodeBlock-background, var(--raised)); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .lastmsg { white-space: pre-wrap; max-height: 200px; overflow: auto; margin: 8px 0 2px; overflow-wrap: anywhere; }
  .tools { list-style: none; margin: 8px 0 2px; padding: 0; max-height: 300px; overflow: auto; counter-reset: t; }
  .tools li { display: grid; grid-template-columns: 26px 70px minmax(0, 1fr); gap: 6px; padding: 2px 0; font-size: 12px; counter-increment: t; }
  .tools li::before { content: counter(t); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .tools b { font-weight: 600; }
  .tools span { color: var(--muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files { margin: 8px 0 2px; padding: 0; list-style: none; font-family: var(--mono); font-size: 12px; }
  .files li { overflow-wrap: anywhere; padding: 1px 0; }
  .ids { color: var(--muted); font-family: var(--mono); font-size: 11px; display: grid; gap: 2px; overflow-wrap: anywhere; }
  .empty { color: var(--muted); }
  .placeholder { padding: 28px 18px; color: var(--muted); text-align: center; }

  /* ── lower tables ───────────────────────────────────── */
  .lower { padding: 0 28px 48px; }
  h2 { font-size: 13px; font-weight: 600; margin: 8px 0 10px; display: flex; gap: 8px; align-items: center; }
  h2 .n { color: var(--muted); font-weight: 400; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 24px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--panel); }
  td.file { overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; }

  @media (max-width: 960px) { main { grid-template-columns: 1fr; } .details { position: static; max-height: none; } .nums .meter { display: none; } }
  @media (prefers-reduced-motion: reduce) { .live .dot, .dot.live { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>Agent map</h1>
    <div class="pulse" id="pulse"></div>
    <span class="spacer"></span>
    <div class="seg"><button id="expandAll" title="Expand every session">Expand all</button><button id="collapseAll" title="Collapse every session">Collapse all</button></div>
  </div>
  <div class="filters">
    <button class="tog" data-f="showClosed">Closed sessions</button>
    <button class="tog" data-f="showEmpty">Sessions without agents</button>
    <button class="tog" data-f="onlyHere">Only this project</button>
    <button class="tog" data-f="hideDone">Hide finished agents</button>
  </div>
</header>
<main>
  <div id="maps"></div>
  <aside class="details" id="details"></aside>
</main>
<section class="lower">
  <div id="asks"></div>
  <div id="unlinkedWrap"></div>
</section>

<script>
const vscode = acquireVsCodeApi();
const state = Object.assign({ sel: null, toggled: {}, all: null, showClosed: false, showEmpty: true, onlyHere: false, hideDone: false, open: {} }, vscode.getState() || {});
state.open ||= {}; // Prompt / Tool calls fold state survives the 4s re-render
delete state.onlyAgents;
// collapsed = user's choice if they toggled it, else the default (closed sessions start collapsed)
const collapsed = (key, def) => key in state.toggled ? state.toggled[key] : state.all ? state.all === 'shut' : def;
const countAll = (id, byParent) => (byParent[id] || []).reduce((n, k) => { const c = countAll(k.id, byParent); return { all: n.all + 1 + c.all, run: n.run + (k.running ? 1 : 0) + c.run }; }, { all: 0, run: 0 });
const hiddenChip = c => `<span class="chip">+${c.all} agent${c.all === 1 ? '' : 's'}${c.run ? ` · ${c.run} running` : ''}</span>`;
let defaults = {};
let asked = null; // transcript last requested via 'select'
let data = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tok = n => n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
const dur = ms => { const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const model = m => !m ? '' : m.replace(/^claude-/, '').replace(/-(\d+)-(\d+)(-.*)?$/, ' $1.$2').replace(/-(\d+)$/, ' $1')
  .replace(/^\w/, c => c.toUpperCase());
const ago = t => dur(Date.now() - t) + ' ago';
// ponytail: meter scale = 200k context window; 1M-context models just peg at full
const meter = n => `<span class="meter" title="${tok(n)} of 200k context"><i style="width:${Math.min(100, (n || 0) / 2000)}%"></i></span>`;

// agent.state string → [class, short label, live?]; label always shown, so color is never the only signal
function status(a) {
  const s = String(a.state || '');
  if (s === 'running' || s === 'status requested') return ['s-run', s === 'running' ? 'running' : 'status asked', true];
  if (s === 'waiting on agents') return ['s-wait', 'waiting', true];
  if (s.startsWith('paused')) return ['s-pause', 'paused', true];
  if (s === 'stop requested') return ['s-bad', 'stopping', true];
  if (s === 'completed') return ['s-done', 'done', false];
  if (s.startsWith('stopped')) return ['s-idle', 'quiet', false]; // no write for 10 min: usually finished without a notice
  if (/fail|kill|error/.test(s)) return ['s-bad', s, false];
  return ['s-idle', s === 'session closed' ? 'closed' : s || 'idle', false];
}
const sessStatus = s => !s.running ? ['s-idle', 'closed', false] : s.status === 'busy' ? ['s-run', 'working', true] : ['s-wait', s.status, false];
const pill = ([cls, label, live]) => `<span class="pill ${cls} ${live ? 'live' : ''}"><span class="dot"></span>${esc(label)}</span>`;

for (const b of document.querySelectorAll('[data-f]')) {
  b.setAttribute('aria-pressed', !!state[b.dataset.f]);
  b.onclick = () => { state[b.dataset.f] = !state[b.dataset.f]; b.setAttribute('aria-pressed', state[b.dataset.f]); save(); render(); };
}
const norm = p => String(p || '').replace(/[\\/]+$/, '').toLowerCase();
const shown = s => state.hideDone ? s.agents.filter(a => a.running) : s.agents;
function save() { vscode.setState(state); }
const asksFor = files => (data.messages || []).filter(m => files.includes(m.file));

function caret(key, shut, has) {
  return has ? `<span class="caret" data-toggle="${esc(key)}" title="${shut ? 'Expand' : 'Collapse'}">${shut ? '▶' : '▼'}</span>` : '<span class="caret"></span>';
}

function agentChips(a) {
  if (!a.claim) return '';
  const c = a.claim, out = [];
  out.push(c.released_at ? `<span class="chip">released · ${c.files.length} file${c.files.length === 1 ? '' : 's'}</span>`
                         : `<span class="chip">🔒 ${c.files.length} file${c.files.length === 1 ? '' : 's'}</span>`);
  for (const m of asksFor(c.files)) out.push(`<span class="chip ${m.verdict || 'pending'}">↔ ${m.verdict || 'ask pending'}</span>`);
  return out.join('');
}

function tree(s, a, byParent) {
  const kids = byParent[a.id] || [];
  const key = s.id + ':' + a.id;
  const st = status(a);
  if (kids.length) defaults[key] = !a.running;
  const shut = kids.length && collapsed(key, !a.running);
  const chips = agentChips(a) + (shut ? hiddenChip(countAll(a.id, byParent)) : '');
  return `<div class="row ${state.sel === key ? 'sel' : ''}" data-key="${esc(key)}">
      ${caret(key, shut, kids.length)}${pill(st)}
      <span class="name">${esc(a.desc)}<span class="type">${esc(a.type)}</span></span>
      <span class="nums">${chips ? `<span class="chips">${chips}</span>` : ''}<span class="t">${dur(a.ms)}</span>
        <span class="t">${tok(a.tokens)}</span><span class="${st[0]}">${meter(a.tokens)}</span></span>
    </div>${kids.length && !shut ? `<div class="kids">${kids.map(k => tree(s, k, byParent)).join('')}</div>` : ''}`;
}

function renderPulse() {
  const all = data.sessions.flatMap(s => s.agents);
  const by = cls => all.filter(a => status(a)[0] === cls).length;
  const stat = (cls, n, label, live) => `<span class="stat ${cls} ${n ? '' : 'zero'} ${live && n ? 'live' : ''}"><span class="dot"></span><b>${n}</b> ${label}</span>`;
  const asks = (data.messages || []).filter(m => !m.verdict).length;
  $('pulse').innerHTML = stat('s-run', by('s-run'), 'running', true) + stat('s-wait', by('s-wait'), 'waiting', true)
    + stat('s-pause', by('s-pause'), 'paused') + stat('s-bad', by('s-bad'), 'failed / stopping')
    + stat('s-idle', data.sessions.filter(s => s.running).length, 'open sessions')
    + (asks ? stat('s-pause', asks, 'share asks') : '')
    + `<span class="stat zero">${all.length} agents · 24h</span>`;
}

function renderMaps() {
  const here = (data.here || []).map(norm);
  const sessions = data.sessions.filter(s => (state.showClosed || s.running)
    && (state.showEmpty || s.agents.length)
    && (!state.onlyHere || here.includes(norm(s.cwd))));
  if (!sessions.length) { $('maps').innerHTML = '<div class="session placeholder">No sessions match these filters. Toggle <b>Closed sessions</b> to see the last 24 hours.</div>'; return; }
  defaults = {};
  $('maps').innerHTML = sessions.map(s => {
    const list = shown(s);
    const ids = new Set(list.map(a => a.id));
    const byParent = {};
    for (const a of list) (byParent[a.parent && ids.has(a.parent) ? a.parent : 'root'] ||= []).push(a);
    for (const k in byParent) byParent[k].sort((x, y) => x.start - y.start);
    const top = byParent.root || [];
    const key = s.id + ':root';
    if (top.length) defaults[key] = !s.running;
    const shut = top.length && collapsed(key, !s.running);
    const run = s.agents.filter(a => a.running).length;
    const ss = sessStatus(s);
    return `<div class="session ${s.running ? '' : 'dim'}">
      <div class="row shead ${state.sel === key ? 'sel' : ''}" data-key="${esc(key)}">
        ${caret(key, shut, top.length)}${pill(ss)}
        <span class="name">${esc(s.title)}<small>${esc(s.cwd ? s.cwd.split(/[\\/]/).filter(Boolean).pop() : s.project)}</small></span>
        <span class="nums">${shut && top.length ? hiddenChip(countAll('root', byParent)) : ''}
          <span>${s.agents.length} agent${s.agents.length === 1 ? '' : 's'}${run ? ` · ${run} live` : ''}</span>
          <span>${esc(model(s.model))}</span><span class="t">${tok(s.tokens)}</span><span class="${ss[0]}">${meter(s.tokens)}</span></span>
      </div>
      ${top.length && !shut ? `<div class="body">${top.map(a => tree(s, a, byParent)).join('')}</div>` : ''}</div>`;
  }).join('');
}

const statTile = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;

function renderDetails() {
  const el = $('details');
  if (!state.sel) { el.innerHTML = '<div class="placeholder">Select a session or agent to see what it is doing.</div>'; return; }
  const [sid, aid] = state.sel.split(':');
  const s = data.sessions.find(x => x.id === sid);
  if (!s) { el.innerHTML = '<div class="placeholder">That session is older than 24 hours.</div>'; return; }
  if (aid === 'root') {
    el.innerHTML = `<div class="dhead"><div class="sub">${pill(sessStatus(s))}<span>${s.running ? 'session' : 'last activity ' + ago(s.mtime)}</span></div><h3>${esc(s.title)}</h3></div>
      <dl class="stats">${statTile('Model', esc(model(s.model) || '—'))}${statTile('Context', tok(s.tokens) + ' tokens')}
        ${statTile('Agents', `${s.agents.length} · ${s.agents.filter(a => a.running).length} running`)}${statTile('Project', esc(s.project))}</dl>
      <div class="acts"><button class="btn primary" data-open="${esc(s.id)}" data-cwd="${esc(s.cwd)}">Open session</button></div>
      <div class="sec"><div class="ids"><span>session ${esc(s.id)}</span>${s.cwd ? `<span>${esc(s.cwd)}</span>` : ''}</div></div>`;
    return;
  }
  const a = s.agents.find(x => x.id === aid);
  if (!a) { el.innerHTML = '<div class="placeholder">Agent not found.</div>'; return; }
  // prompt + tool calls are fetched for the selected agent only (keeps the 4s payload small)
  const d = data.detail && data.detail.file === a.file ? data.detail : null;
  if (a.file && !d && asked !== a.file) { asked = a.file; vscode.postMessage({ cmd: 'select', file: a.file }); }
  const parent = s.agents.find(x => x.id === a.parent);
  const c = a.claim;
  const asks = c ? asksFor(c.files) : [];
  const st = status(a);
  const fold = (k, title, n, body) => `<details class="sec" data-fold="${k}" ${state.open[k] ? 'open' : ''}><summary>${title}${n != null ? `<span class="n">${n}</span>` : ''}</summary>${body}</details>`;
  el.innerHTML = `<div class="dhead"><div class="sub">${pill(st)}<span class="type" style="margin:0">${esc(a.type)}</span></div><h3>${esc(a.desc)}</h3></div>
    ${a.activity ? `<div class="activity ${st[0]}"><span class="dot live"></span><span>${a.activity.name === 'Thinking' ? 'Thinking…' : `<b>${esc(a.activity.name)}</b> ${esc(a.activity.arg)}`}</span></div>` : ''}
    <dl class="stats">${statTile('Running time', dur(a.ms))}${statTile('Context', tok(a.tokens) + ' tokens')}
      ${statTile('Model', esc(model(a.model) || '—'))}${statTile('Spawned by', esc(parent ? parent.desc : s.title))}</dl>
    <div class="acts">${a.running ? `
      ${a.ctl === 'pause' ? `<button class="btn primary" data-act="" data-agent="${esc(a.id)}">Resume</button>` : `<button class="btn" data-act="pause" data-agent="${esc(a.id)}">Pause</button>`}
      <button class="btn" data-act="status" data-agent="${esc(a.id)}">Request status</button>
      <button class="btn danger" data-act="stop" data-agent="${esc(a.id)}">Stop</button><span class="spacer"></span>` : ''}
      ${a.file ? `<button class="btn" data-transcript="${esc(a.file)}">Transcript</button>` : ''}
      <button class="btn ${a.running ? '' : 'primary'}" data-open="${esc(s.id)}" data-cwd="${esc(s.cwd)}">Open session</button></div>
    ${d && d.prompt ? fold('prompt', 'Prompt', null, `<div class="pre">${esc(d.prompt)}</div>`) : ''}
    ${d && d.tools.length ? fold('tools', 'Tool calls', d.tools.length, `<ol class="tools">${d.tools.map(t =>
      `<li title="${esc(t.arg)}"><b>${esc(t.name)}</b><span>${esc(t.arg)}</span></li>`).join('')}</ol>`) : ''}
    ${a.lastText ? `<div class="sec"><h4>Last message</h4><div class="lastmsg">${esc(a.lastText)}</div></div>` : ''}
    ${c ? `<div class="sec"><h4>Claimed files <span class="chip">${c.released_at ? 'released ' + ago(Date.parse(c.released_at)) : 'held ' + ago(Date.parse(c.claimed_at))}</span></h4>
      <ul class="files">${c.files.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${asks.length ? `<div class="sec"><h4>Share requests</h4><ul class="files">${asks.map(m => `<li><b>${esc(m.from)} → ${esc(m.to)}</b> <span class="chip ${m.verdict || 'pending'}">${m.verdict || 'pending'}</span><br>${esc(m.text)}${m.reply ? `<br><i>${esc(m.reply)}</i>` : ''}</li>`).join('')}</ul></div>` : ''}
    <div class="sec"><div class="ids"><span>agent ${esc(a.id)}</span>${c ? `<span>claim by ${esc(c.session)}</span>` : ''}</div></div>`;
}

function renderAsks() {
  const ms = (data.messages || []).slice().sort((x, y) => Date.parse(y.at) - Date.parse(x.at));
  $('asks').innerHTML = `<h2>Share requests <span class="n">${ms.length}</span></h2>` + (ms.length
    ? `<div class="tablewrap"><table><tr><th>When</th><th>From → To</th><th>File</th><th>Request</th><th>Answer</th></tr>${ms.map(m => `
    <tr><td>${ago(Date.parse(m.at))}</td><td>${esc(m.from)} → ${esc(m.to)}</td><td class="file">${esc(m.file)}</td>
    <td>${esc(m.text)}</td><td><span class="chip ${m.verdict || 'pending'}">${m.verdict || 'pending'}</span> ${esc(m.reply || '')}</td></tr>`).join('')}</table></div>`
    : '<p class="empty">No agent asked to share a claimed file in the last 24 hours.</p>');
  const u = data.unlinked || [];
  const held = u.filter(c => !c.released_at).map(c => c.id);
  $('unlinkedWrap').innerHTML = u.length ? `<h2>Claims without a matching agent <span class="n">${u.length}</span>
    ${held.length > 1 ? `<button class="btn danger" data-release="${held.join(',')}">${armed === held.join(',') ? 'Click again to release all' : `Release all ${held.length} held`}</button>` : ''}</h2>
    <div class="tablewrap"><table><tr><th>Session</th><th>Agent</th><th>Task</th><th>Files</th><th>State</th></tr>${u.map(c => `
    <tr><td>${esc(c.session)}</td><td>${esc(c.agent)}</td><td>${esc(c.task)}</td><td class="file">${c.files.map(esc).join('<br>')}</td>
    <td>${c.released_at ? 'released' : `held <button class="btn danger" data-release="${esc(c.id)}" title="Free these files for other agents">${armed === c.id ? 'Click again' : 'Release'}</button>`}</td></tr>`).join('')}</table></div>` : '';
}

function render() { if (!data) return; renderPulse(); renderMaps(); renderDetails(); renderAsks(); }

$('expandAll').onclick = () => { state.toggled = {}; state.all = 'open'; save(); render(); };
$('collapseAll').onclick = () => { state.toggled = {}; state.all = 'shut'; save(); render(); };
$('maps').addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if (t) { const k = t.dataset.toggle; state.toggled[k] = !collapsed(k, defaults[k]); save(); render(); return; }
  const r = e.target.closest('.row');
  if (!r) return;
  state.sel = r.dataset.key; save(); render();
});
// ponytail: controls act at the agent's next tool call (hooks/agent-control.js); nothing can interrupt mid-thought
let armed = null, armTimer; // data-release value awaiting its confirming click
// two-step: first click arms the button (webviews have no confirm()), second click within 4s releases
$('unlinkedWrap').addEventListener('click', e => {
  const b = e.target.closest('[data-release]');
  if (!b) return;
  const ids = b.dataset.release;
  if (armed !== ids) { armed = ids; clearTimeout(armTimer); armTimer = setTimeout(() => { armed = null; render(); }, 4000); render(); return; }
  armed = null; vscode.postMessage({ cmd: 'release', ids: ids.split(',') });
});
$('details').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.transcript) vscode.postMessage({ cmd: 'transcript', file: b.dataset.transcript });
  else if (b.dataset.open) vscode.postMessage({ cmd: 'open', session: b.dataset.open, cwd: b.dataset.cwd });
  else if ('act' in b.dataset) vscode.postMessage({ cmd: 'control', agent: b.dataset.agent, action: b.dataset.act || null });
});
// toggle doesn't bubble → capture phase
$('details').addEventListener('toggle', e => { const f = e.target.dataset.fold; if (f) { state.open[f] = e.target.open; save(); } }, true);
window.addEventListener('message', e => { data = e.data; render(); });
vscode.postMessage('ready');
</script>
</body>
</html>
